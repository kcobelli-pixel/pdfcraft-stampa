# Rebuilds each new PdfCraft release (storytold/pdfcraft) with this repository's patches and
# publishes the result as a release tagged like upstream:
#   Windows x64 (MSI, portable zip): the Brother print fix (apply_print_fix.sh) and several saved
#     signatures (apply_signatures.sh);
#   macOS universal (DMG): several saved signatures.
# windows/Applica-patch.ps1 and mac/Applica-patch.command install the build matching the installed
# PdfCraft version. A platform whose patches are all in the official sources gets
# PATCH-UFFICIALE-<platform>.txt instead of a build.
#
# A platform counts as published once SHA256SUMS.txt (always uploaded last) lists its package, or
# its marker is there. Only missing platforms are built, and one failing never holds back the
# other: the next hourly run retries just the missing one.
name: Build PdfCraft with the patches

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'PdfCraft tag, e.g. v0.14.0 (empty: the latest release)'
        required: false

permissions: {}

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      build: ${{ steps.pick.outputs.build }}
      exists: ${{ steps.pick.outputs.exists }}
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Pick the tag and the missing platforms
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$(gh release view -R storytold/pdfcraft --json tagName --jq .tagName)}"
          # The tag comes from upstream: only plain release tags reach a shell or a file name.
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::unexpected tag '$tag'"; exit 1; fi
          v="${tag#v}"
          assets='' sums=''
          if assets="$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/tmp/err)"; then
            exists=true
            sums="$(gh release download "$tag" -R "$GITHUB_REPOSITORY" -p SHA256SUMS.txt -O - 2>/dev/null)" || sums=''
          elif grep -q 'release not found' /tmp/err; then
            exists=false
          else
            echo "::error::checking for $tag failed: $(cat /tmp/err)"; exit 1
          fi
          # A package counts once its receipt (PATCHES-<platform>.txt, the patches it has) is there
          # too, so builds from before a patch was added are made again.
          done_for() {
            grep -qx "PATCH-UFFICIALE-$1.txt" <<<"$assets" || {
              grep -qx "PATCHES-$1.txt" <<<"$assets" &&
                awk -v n="$2" 'length($1) == 64 && $1 ~ /^[0-9a-f]+$/ && ($2 == n || $2 == "*" n) { f = 1 } END { exit !f }' <<<"$sums"
            }
          }
          legs='[]'
          if ! done_for windows "pdfcraft-$v-windows-x64.msi"; then
            legs="$(jq -c '. + [{"os": "windows-latest", "platform": "windows", "targets": "x86_64-pc-windows-msvc", "artifact": "release-windows-x64", "binary": "target/x86_64-pc-windows-msvc/release/pdfcraft.exe"}]' <<<"$legs")"
          fi
          if ! done_for mac "pdfcraft-$v-macos-universal.dmg"; then
            legs="$(jq -c '. + [{"os": "macos-15", "platform": "mac", "targets": "aarch64-apple-darwin, x86_64-apple-darwin", "artifact": "release-macos", "binary": "target/macos-package/PdfCraft.app/Contents/MacOS/PdfCraft"}]' <<<"$legs")"
          fi
          build="$(jq -r 'if length > 0 then "true" else "false" end' <<<"$legs")"
          {
            echo "tag=$tag"
            echo "build=$build"
            echo "exists=$exists"
            echo "matrix={\"include\":$legs}"
          } >> "$GITHUB_OUTPUT"
          echo "PdfCraft $tag: exists=$exists, to build: $(jq -r 'map(.platform) | join(", ")' <<<"$legs")"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: patch
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/pdfcraft
          ref: ${{ needs.plan.outputs.tag }}
          path: pdfcraft
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}
      - name: Apply the patches
        id: fix
        shell: bash
        run: |
          set +e
          fixes=''
          bash patch/apply_signatures.sh pdfcraft; code=$?
          if [ "$code" -eq 0 ]; then
            fixes=signatures
          elif [ "$code" -ne 3 ]; then
            # On Windows a conflict here must not cost the print fix: drop it and carry on.
            [ "$PLATFORM" = windows ] || exit "$code"
            echo "::warning::the signatures patch did not apply to ${{ needs.plan.outputs.tag }}: Windows gets the print fix only"
            git -C pdfcraft reset -q --hard
          fi
          # The print fix is for Windows drivers only.
          if [ "$PLATFORM" = windows ]; then
            bash patch/apply_print_fix.sh pdfcraft; code=$?
            if [ "$code" -eq 0 ]; then fixes="$fixes print"; elif [ "$code" -ne 3 ]; then exit "$code"; fi
          fi
          fixes="${fixes# }"
          echo "fixes=$fixes" >> "$GITHUB_OUTPUT"
          echo "patches applied: ${fixes:-none}"
          if [ -z "$fixes" ]; then
            mkdir -p pdfcraft/dist/release
            echo "PdfCraft ${{ needs.plan.outputs.tag }} contiene già tutto quello che aggiungeva la patch: non serve più." > "pdfcraft/dist/release/PATCH-UFFICIALE-$PLATFORM.txt"
          fi
      - name: Read the craft-fonts pin
        id: fonts
        if: steps.fix.outputs.fixes != ''
        shell: bash
        run: |
          # Only the 40 hex digits: a CRLF checkout, quotes or a comment can't leak into the ref.
          ref="$(sed -n 's/^ *craft-fonts-ref: *["'\'']\{0,1\}\([0-9a-f]\{40\}\).*/\1/p' pdfcraft/.github/workflows/release.yml | head -n1)"
          if ! [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::unexpected craft-fonts-ref '$ref'"; exit 1; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.fix.outputs.fixes != ''
        with:
          repository: storytold/craft-fonts
          ref: ${{ steps.fonts.outputs.ref }}
          path: craft-fonts
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.fix.outputs.fixes != ''
        with:
          workspaces: pdfcraft
      - name: Install WiX
        if: steps.fix.outputs.fixes != '' && runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      - name: Package for Windows (unsigned)
        if: steps.fix.outputs.fixes != '' && runner.os == 'Windows'
        shell: pwsh
        # The packaging scripts run cargo in the current directory.
        working-directory: pdfcraft
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: '1'
        run: ./packaging/windows/package.ps1 -Arch x64
      - name: Package for macOS (ad-hoc signed)
        if: steps.fix.outputs.fixes != '' && runner.os == 'macOS'
        working-directory: pdfcraft
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: '1'
        run: packaging/macos/package.sh --arch universal
      - name: Check the build has the patches
        if: steps.fix.outputs.fixes != ''
        shell: bash
        env:
          BINARY: pdfcraft/${{ matrix.binary }}
          FIXES: ${{ steps.fix.outputs.fixes }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          case "$PLATFORM" in
            windows) package="pdfcraft-${TAG#v}-windows-x64.msi" ;;
            mac) package="pdfcraft-${TAG#v}-macos-universal.dmg" ;;
          esac
          [ -f "pdfcraft/dist/release/$package" ] || { echo "::error::no $package"; exit 1; }
          # Strings only the patched code carries: the GDI retry's receipt and the settings key.
          for fix in $FIXES; do
            case "$fix" in
              print) mark='through GDI' ;;
              signatures) mark='more_signatures' ;;
            esac
            LC_ALL=C grep -a -q "$mark" "$BINARY" || { echo "::error::$fix patch missing from $BINARY"; exit 1; }
          done
          # The receipt: which patches this build has (plan and the install scripts read it).
          printf '%s\n' $FIXES > "pdfcraft/dist/release/PATCHES-$PLATFORM.txt"
          ls -l pdfcraft/dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: pdfcraft/dist/release/*
          if-no-files-found: error

  release:
    needs: [plan, build]
    # Also after a failed leg: whatever did build is published.
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      EXISTS: ${{ needs.plan.outputs.exists }}
      BUILD_RESULT: ${{ needs.build.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Publish the release
        run: |
          mkdir -p artifacts sums
          notes="PdfCraft $TAG ricompilato da storytold/pdfcraft $TAG con le patch di questo repository. Windows: correzione per le stampanti Brother (se il driver rifiuta la stampa XPS, errore 0x80040003 \"Interfaccia non supportata\", il documento viene stampato tramite GDI) e più firme salvate in Compila e firma. Mac: più firme salvate. Build non ufficiali e non firmate. Si installano con i file della release strumenti (Windows: Applica-patch.cmd; Mac: Applica-patch.command)."
          cd artifacts
          if [ -z "$(ls)" ]; then echo "::error::nothing was built"; exit 1; fi
          packages="$(ls | grep -v -e '^PATCH-UFFICIALE-' -e '^PATCHES-' || true)"
          if [ -n "$packages" ]; then
            # Checksums of the new packages, plus the published ones they don't replace.
            sha256sum -- $packages > ../sums/new.txt
            : > ../sums/old.txt
            if [ "$EXISTS" = "true" ] && gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx SHA256SUMS.txt; then
              gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS.txt -O ../sums/old.txt --clobber
            fi
            awk 'NR == FNR { replaced[$2] = 1; next } !($2 in replaced)' ../sums/new.txt ../sums/old.txt > ../sums/kept.txt
            sort -k2 ../sums/kept.txt ../sums/new.txt > ../sums/SHA256SUMS.txt
            cat ../sums/SHA256SUMS.txt
          fi
          if [ "$EXISTS" = "true" ]; then
            # Packages first and the checksums last: a download in between fails its hash check.
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber -- *
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "$notes"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "PdfCraft $TAG con le patch" --notes "$notes" --latest=false -- *
          fi
          if [ -f ../sums/SHA256SUMS.txt ]; then
            # Every package on the release must keep its line, or its patch would read "not ready".
            for a in $(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -vx -e SHA256SUMS.txt -e 'PATCH-UFFICIALE-.*' -e 'PATCHES-.*' -e 'STAMPA-UFFICIALE.txt'); do
              grep -q "  $a\$" ../sums/SHA256SUMS.txt || { echo "::error::SHA256SUMS.txt would miss $a"; exit 1; }
            done
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber -- ../sums/SHA256SUMS.txt
          fi
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "::error::a platform failed to build; the next run retries it"; exit 1
          fi
      # shortcut: GitHub turns off scheduled workflows after 60 days without repository activity;
      # one commit per upstream release keeps it on while PdfCraft keeps releasing.
      - name: Record the version
        if: env.EXISTS == 'false'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo "$TAG" >> versions.txt
          git add versions.txt
          git commit -m "chore: built $TAG"
          # main may have moved during the build.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
